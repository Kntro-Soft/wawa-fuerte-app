name: Feature request
description: Propose a new feature or capability
title: "feat: <short description>"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What user need or technical problem does this address?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app would this land in? See AGENTS.md for ownership.
      options:
        - inference
        - rag
        - nutrition
        - storage
        - onboarding
        - home
        - plan
        - ci
        - docs
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Architectural constraints
      description: These are non-negotiable. See docs/adr/ — the ADRs are the source of truth.
      options:
        - label: Works fully offline — no backend, no network call, no API key (ADR-0002)
          required: true
        - label: Does not require a hemoglobin reading to work (ADR-0007)
          required: true
        - label: Any nutritional figure shown to the user is computed in Dart, not generated by the model (ADR-0005)
          required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - Given ...
        - When ...
        - Then ...
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Sprint scope
      description: Is this needed for the demo, or is it post-hackathon work?
      options:
        - Needed for the demo
        - Nice to have if time allows
        - Post-hackathon
    validations:
      required: false
